                if (Array.isArray(data)) throw new Error('stamp path is a directory');
                const Ow = Buffer.from(data.content, 'base64').toString('utf8');
                return { Ow, GRcD: data.sha };
              } catch (e) {
                if (e.status === 404) return { Ow: '', GRcD: undefined };
